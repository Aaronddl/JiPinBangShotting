<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>极品帮射击游戏</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#04060a;color:#cfe9ff;
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;cursor:default;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  #game{position:fixed;inset:0}
  canvas{display:block}

  /* ================= HUD ================= */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  #hud.show{opacity:1}

  /* 准星 */
  .crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
  .crosshair span{position:absolute;background:#79f0ff;box-shadow:0 0 8px #24d8ff;border-radius:1px}
  .ch-t{left:50%;top:0;width:2px;height:8px;transform:translateX(-50%)}
  .ch-b{left:50%;bottom:0;width:2px;height:8px;transform:translateX(-50%)}
  .ch-l{top:50%;left:0;height:2px;width:8px;transform:translateY(-50%)}
  .ch-r{top:50%;right:0;height:2px;width:8px;transform:translateY(-50%)}
  .ch-dot{left:50%;top:50%;width:2px;height:2px;transform:translate(-50%,-50%);opacity:.9}

  /* 生命值 */
  .hp{position:absolute;left:28px;bottom:28px;width:250px}
  .stat-label{font-size:11px;letter-spacing:3px;color:#5f8ba8;margin-bottom:7px;font-weight:600}
  .bar{height:12px;background:rgba(10,30,45,.75);border:1px solid rgba(60,180,220,.35);
       border-radius:2px;overflow:hidden;box-shadow:0 0 14px rgba(0,200,255,.15) inset}
  .bar-fill{height:100%;width:100%;border-radius:1px;
            background:linear-gradient(90deg,#12e0a0,#7ef6ff);
            transition:width .15s linear;box-shadow:0 0 14px rgba(60,240,220,.7)}

  /* 分数 / 波次 */
  .score{position:absolute;right:28px;top:24px;text-align:right}
  .wave{position:absolute;right:28px;top:88px;text-align:right}
  .stat-value{font-size:32px;font-weight:800;letter-spacing:2px;color:#7ef6ff;
              text-shadow:0 0 18px rgba(30,220,255,.65);line-height:1}

  /* 武器 / 弹药 */
  .ammo-panel{position:absolute;right:28px;bottom:24px;text-align:right}
  .weapon-name{font-size:13px;letter-spacing:3px;color:#8ad7ee;margin-bottom:5px;
               font-weight:700;text-shadow:0 0 12px rgba(24,224,255,.45)}
  .ammo{font-size:26px;font-weight:800;letter-spacing:2px;color:#7ef6ff;
        text-shadow:0 0 18px rgba(30,220,255,.65);line-height:1}

  /* 波次提示 */
  .banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);
          font-size:46px;font-weight:900;letter-spacing:10px;color:#7ef6ff;
          text-shadow:0 0 30px #18e0ff,0 0 60px rgba(24,224,255,.5);opacity:0;
          white-space:nowrap}

  /* ================= 连击特效 ================= */
  .combo{
    position:absolute;left:50%;bottom:19%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;opacity:0;transition:opacity .25s;
  }
  .combo.show{opacity:1}
  .combo-text{
    font-size:46px;font-weight:900;letter-spacing:8px;
    color:#ffe066;
    text-shadow:0 0 20px rgba(255,200,60,.9),0 0 52px rgba(255,150,30,.55);
    white-space:nowrap;
  }
  .combo-text.pop{animation:comboPop .42s cubic-bezier(.2,1.6,.4,1)}
  @keyframes comboPop{
    0%{transform:scale(.35);opacity:0}
    55%{transform:scale(1.28);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  .combo-sub{
    font-size:16px;font-weight:800;letter-spacing:5px;
    color:#ffdd44;opacity:0;
    text-shadow:0 0 12px rgba(255,220,80,.85),0 0 26px rgba(255,170,40,.5);
  }
  .combo-sub.pop{animation:headshotPop 1.6s ease-out forwards}
  @keyframes headshotPop{
    0%{opacity:0;transform:translateY(8px) scale(.8)}
    15%{opacity:1;transform:translateY(0) scale(1.12)}
    32%{transform:translateY(0) scale(1)}
    72%{opacity:1}
    100%{opacity:0;transform:translateY(-6px)}
  }

  /* 受伤红屏 */
  #damage{position:absolute;inset:0;opacity:0;pointer-events:none;
          background:radial-gradient(circle at center,transparent 35%,rgba(255,20,60,.9) 100%)}

  /* ================= 遮罩层 ================= */
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;text-align:center;
    padding:20px;
    background:radial-gradient(circle at 50% 45%,rgba(10,30,55,.82),rgba(3,5,10,.96));
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;
    backdrop-filter:blur(3px);
  }
  #overlay.show{opacity:1;pointer-events:auto}
  #overlayTitle{
    font-size:54px;font-weight:900;letter-spacing:12px;color:#eafcff;
    text-shadow:0 0 26px #18e0ff,0 0 70px rgba(24,224,255,.55);
  }
  #overlaySub{font-size:16px;letter-spacing:3px;color:#7fa8c4;max-width:560px;line-height:1.9}
  #startBtn{
    margin-top:6px;padding:15px 54px;font-size:17px;font-weight:800;letter-spacing:5px;
    color:#04141c;cursor:pointer;border:none;border-radius:3px;
    background:linear-gradient(180deg,#8ef7ff,#18c8f0);
    box-shadow:0 0 28px rgba(24,224,255,.65),0 0 70px rgba(24,224,255,.3);
    transition:transform .15s,box-shadow .15s;
  }
  #startBtn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(24,224,255,.95),0 0 90px rgba(24,224,255,.45)}
  #startBtn:active{transform:translateY(0)}
  .keys{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;
        margin-top:14px;font-size:12px;letter-spacing:2px;color:#4f7893}
  .keys b{color:#8ad7ee;font-weight:700}

  .touch-hint{display:none;font-size:12px;letter-spacing:2px;color:#7fd8ee;
              max-width:340px;line-height:2;margin-top:4px}

  /* ================= 设置面板 ================= */
  #settingsPanel{
    display:none;width:380px;max-width:92vw;padding:22px 26px;
    border:1px solid rgba(60,180,220,.35);border-radius:4px;
    background:rgba(8,20,35,.78);
    box-shadow:0 0 26px rgba(24,224,255,.15),0 0 60px rgba(24,224,255,.06) inset;
  }
  #settingsPanel.show{display:block}
  .setting-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .setting-row:last-child{margin-bottom:0}
  .setting-row label{font-size:13px;letter-spacing:2px;color:#8ad7ee;white-space:nowrap;min-width:88px}
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:linear-gradient(90deg,#18e0ff,#7ef6ff);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#eafcff;box-shadow:0 0 12px #18e0ff;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:50%;
    background:#eafcff;box-shadow:0 0 12px #18e0ff;cursor:pointer;
  }
  .setting-val{font-size:13px;color:#7ef6ff;min-width:48px;text-align:right;font-weight:700}

  /* ================= 移动端控制 ================= */
  #mobileControls{
    position:fixed;inset:0;display:none;pointer-events:none;z-index:5;
    touch-action:none;
  }
  body.mobile #mobileControls{display:block}

  /* 左侧摇杆触摸区 */
  #joystickZone{
    position:absolute;left:0;bottom:0;width:52%;height:62%;
    pointer-events:auto;touch-action:none;
  }
  #joystickBase{
    position:absolute;left:32px;bottom:76px;
    width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(12,40,60,.42), rgba(6,18,30,.26));
    border:2px solid rgba(60,200,240,.38);
    box-shadow:0 0 28px rgba(24,224,255,.18), 0 0 40px rgba(24,224,255,.12) inset;
  }
  #joystickKnob{
    position:absolute;left:50%;top:50%;
    width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #a8f7ff, #18c8f0);
    box-shadow:0 0 22px rgba(24,224,255,.85);
    will-change:transform;
  }

  /* 摇杆上方开火按钮 */
  #fireAboveBtn{
    position:absolute;left:52px;bottom:236px;
    width:96px;height:96px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;letter-spacing:2px;color:#04141c;
    background:radial-gradient(circle at 35% 30%, #8ef7ff, #18c8f0);
    box-shadow:0 0 26px rgba(24,224,255,.7);
    pointer-events:auto;touch-action:none;
    user-select:none;-webkit-user-select:none;
    transition:transform .08s;
  }
  #fireAboveBtn.active{
    transform:scale(.92);
    box-shadow:0 0 42px rgba(24,224,255,1);
  }

  /* 右侧视角 / 开火触摸区 */
  #lookZone{
    position:absolute;right:0;top:0;width:50%;height:100%;
    pointer-events:auto;touch-action:none;
  }

  /* 右下按钮簇 */
  #rightButtons{
    position:absolute;right:22px;bottom:44px;
    display:grid;grid-template-columns:repeat(2,60px);
    grid-template-rows:repeat(2,60px);gap:12px;
    pointer-events:none;z-index:3;
  }
  #rightButtons .mbtn{pointer-events:auto}

  .mbtn{
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    font-size:14px;font-weight:800;letter-spacing:1px;color:#9fe8ff;
    background:rgba(10,32,50,.55);
    border:2px solid rgba(60,200,240,.42);
    box-shadow:0 0 16px rgba(24,224,255,.25);
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:background .08s, box-shadow .08s;
  }
  .mbtn.active{
    background:rgba(24,224,255,.38);
    color:#04141c;
    box-shadow:0 0 28px rgba(24,224,255,.9);
  }

  /* 暂停按钮 */
  #pauseBtn{
    position:absolute;left:14px;top:14px;
    width:44px;height:44px;font-size:16px;border-radius:50%;
    pointer-events:auto;z-index:3;
  }

  /* ---------- 移动端 HUD 重排 ---------- */
  body.mobile .hp{
    left:50%;transform:translateX(-50%);
    bottom:auto;top:10px;width:150px;
  }
  body.mobile .hp .stat-label{text-align:center;font-size:9px;margin-bottom:5px;letter-spacing:2px}
  body.mobile .hp .bar{height:9px}

  body.mobile .ammo-panel{
    left:50%;transform:translateX(-50%);
    right:auto;bottom:auto;top:40px;text-align:center;
  }
  body.mobile .weapon-name{font-size:10px;margin-bottom:2px;letter-spacing:2px}
  body.mobile .ammo{font-size:17px}

  body.mobile .score{right:12px;top:10px}
  body.mobile .score .stat-label{font-size:9px;margin-bottom:3px}
  body.mobile .score .stat-value{font-size:20px}

  body.mobile .wave{right:12px;top:52px}
  body.mobile .wave .stat-label{font-size:9px;margin-bottom:3px}
  body.mobile .wave .stat-value{font-size:20px}

  body.mobile .banner{font-size:28px;letter-spacing:6px;top:26%}

  body.mobile .combo{bottom:32%}
  body.mobile .combo-text{font-size:30px;letter-spacing:5px}
  body.mobile .combo-sub{font-size:12px;letter-spacing:3px}

  body.mobile .keys{display:none}
  body.mobile .touch-hint{display:block}

  body.mobile #overlayTitle{font-size:38px;letter-spacing:8px}
  body.mobile #overlaySub{font-size:13px;letter-spacing:2px}
  body.mobile #startBtn{padding:14px 44px;font-size:15px;letter-spacing:4px}

  /* 小屏 / 横屏适配 */
  @media (max-height: 500px) {
    #joystickBase{width:108px;height:108px;left:24px;bottom:52px}
    #joystickKnob{width:48px;height:48px;margin:-24px 0 0 -24px}
    #fireAboveBtn{width:76px;height:76px;left:40px;bottom:176px;font-size:13px}
    #rightButtons{right:16px;bottom:22px;
      grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px);gap:10px}
    #rightButtons .mbtn{font-size:12px}
    #pauseBtn{width:38px;height:38px;font-size:14px;left:10px;top:10px}
    body.mobile .hp{width:120px;top:6px}
    body.mobile .ammo-panel{top:30px}
    body.mobile .ammo{font-size:15px}
    body.mobile .score{top:6px}
    body.mobile .wave{top:42px}
    body.mobile .combo{bottom:38%}
    body.mobile .combo-text{font-size:24px}
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">

    <span class="ch-t"></span><span class="ch-b"></span>

  <div class="combo" id="combo">

</div>

<!-- ================= 移动端触摸控制 ================= -->
<div id="mobileControls">
  <div id="joystickZone">

      <div id="joystickKnob"></div>
    </div>
  </div>

  <div id="fireAboveBtn">开火</div>

  <div id="lookZone"></div>

  <div id="rightButtons">
    <div class="mbtn" id="jumpBtn">跳跃</div>
    <div class="mbtn" id="adsBtn">开镜</div>

  <div class="mbtn" id="pauseBtn">❚❚</div>
</div>

<div id="overlay" class="show">
  <div id="overlayTitle">NEON STRIKE</div>
  <div id="overlaySub">在霓虹竞技场中生存下去，击退一波又一波的敌人。爆头伤害更高！<br>第 5 波起会出现游走型的紫色敌人，小心应对。</div>

  <div id="settingsPanel">
    <div class="setting-row">
      <label for="sensRange">鼠标灵敏度</label>
      <input type="range" id="sensRange" min="0.2" max="3" step="0.05" value="1" />
      <span class="setting-val" id="sensValue">1.00×</span>
    </div>
    <div class="setting-row">
      <label for="musicRange">音乐音量</label>
      <input type="range" id="musicRange" min="0" max="1" step="0.05" value="0.35" />
      <span class="setting-val" id="musicValue">35%</span>
    </div>
    <div class="setting-row">
      <label for="sfxRange">音效音量</label>
      <input type="range" id="sfxRange" min="0" max="1" step="0.05" value="0.75" />
      <span class="setting-val" id="sfxValue">75%</span>
    </div>
  </div>

  <button id="startBtn">开始游戏</button>

  <div class="keys">
    <span><b>W A S D</b> 移动</span>
    <span><b>空格</b> 跳跃</span>
    <span><b>鼠标</b> 瞄准</span>
    <span><b>左键</b> 射击</span>
    <span><b>右键</b> 开镜</span>
    <span><b>R</b> 换弹</span>
    <span><b>1-4 / 滚轮</b> 切换武器</span>

  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   移动端检测
   ========================================================= */
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isMobile = isTouchDevice &&
  (window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 900 ||
   /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent));

if (isMobile) document.body.classList.add('mobile');

/* =========================================================
   音频系统（Web Audio API 合成，无外部资源）
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let sfxGain = null;
let musicGain = null;
let noiseBuffer = null;

const bgm = {
  isPlaying: false,
  currentStep: 0,
  nextNoteTime: 0,
  schedulerId: null,
  bpm: 124,
  get stepDur() { return 60 / this.bpm / 4; }
};

const CHORDS = [
  { root: 110.00, notes: [220.00, 261.63, 329.63] },
  { root: 87.31,  notes: [174.61, 220.00, 261.63] },
  { root: 98.00,  notes: [196.00, 246.94, 293.66] },
  { root: 82.41,  notes: [164.81, 196.00, 246.94] },
];

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.85;
    masterGain.connect(audioCtx.destination);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.75;
    sfxGain.connect(masterGain);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(masterGain);

    const len = audioCtx.sampleRate;
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  } catch (e) {
    console.warn('音频初始化失败', e);
    audioCtx = null;
  }
}

function createNoise() {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  return src;
}

/* ------------------- 射击音效 ------------------- */
function sfxShootRifle(t) {
  const n = createNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(2000, t);
  f.frequency.exponentialRampToValueAtTime(500, t + 0.06);
  f.Q.value = 1.2;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  n.connect(f).connect(g).connect(sfxGain);
  n.start(t); n.stop(t + 0.12);

  const o = audioCtx.createOscillator();
  o.type = 'square';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.05);
  const go = audioCtx.createGain();
  go.gain.setValueAtTime(0.2, t);
  go.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(go).connect(sfxGain);
  o.start(t); o.stop(t + 0.08);
}

function sfxShootShotgun(t) {
  const n = createNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(3000, t);
  f.frequency.exponentialRampToValueAtTime(300, t + 0.15);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.85, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  n.connect(f).connect(g).connect(sfxGain);
  n.start(t); n.stop(t + 0.3);

  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(35, t + 0.18);
  const go = audioCtx.createGain();
  go.gain.setValueAtTime(0.6, t);
  go.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(go).connect(sfxGain);
  o.start(t); o.stop(t + 0.32);
}

function sfxShootSniper(t) {
  const n = createNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(1500, t);
  f.frequency.exponentialRampToValueAtTime(200, t + 0.4);
  f.Q.value = 0.5;
  const g = audioCtx.createGain();

function playKick(time) {
  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, time);
  o.frequency.exponentialRampToValueAtTime(45, time + 0.12);

}

function playSnare(time) {
  const n = createNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 1200;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.32, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
  n.connect(f).connect(g).connect(musicGain);
  n.start(time); n.stop(time + 0.2);
}

function playHihat(time, vol) {
  const n = createNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 7000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  n.connect(f).connect(g).connect(musicGain);
  n.start(time); n.stop(time + 0.06);
}

function playBass(freq, time, dur) {
  const o = audioCtx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.value = freq;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(800, time);
  f.frequency.exponentialRampToValueAtTime(200, time + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.001, time);
  g.gain.linearRampToValueAtTime(0.3, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  o.connect(f).connect(g).connect(musicGain);
  o.start(time); o.stop(time + dur + 0.02);
}

function playPad(freqs, time, dur) {
  freqs.forEach((fq, i) => {
    const o = audioCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = fq;
    o.detune.value = (i - 1) * 5;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, time);
    g.gain.linearRampToValueAtTime(0.055, time + 0.3);
    g.gain.setValueAtTime(0.055, time + dur - 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    o.connect(g).connect(musicGain);
    o.start(time); o.stop(time + dur + 0.05);
  });
}

function scheduleStep(step, time) {
  const stepInBar = step % 16;
  const barIdx = Math.floor(step / 16) % 4;
  const chord = CHORDS[barIdx];

  if (stepInBar === 0) {
    playPad(chord.notes, time, bgm.stepDur * 16);
  }

  if (stepInBar === 0 || stepInBar === 4 || stepInBar === 8 || stepInBar === 12) {
    playBass(chord.root, time, bgm.stepDur * 3.5);
  }
  if (stepInBar === 14) {
    playBass(chord.root * 2, time, bgm.stepDur * 1.5);
  }

  if (stepInBar === 0 || stepInBar === 4 || stepInBar === 8 || stepInBar === 12) {
    playKick(time);
  }
  if (stepInBar === 4 || stepInBar === 12) {
    playSnare(time);
  }
  if (stepInBar === 2 || stepInBar === 6 || stepInBar === 10 || stepInBar === 14) {
    playHihat(time, 0.15);
  }
}

function scheduleBGM() {
  if (!audioCtx || !bgm.isPlaying) return;
  while (bgm.nextNoteTime < audioCtx.currentTime + 0.12) {
    scheduleStep(bgm.currentStep, bgm.nextNoteTime);
    bgm.nextNoteTime += bgm.stepDur;
    bgm.currentStep = (bgm.currentStep + 1) % 64;
  }
}

function startBGM() {
  if (!audioCtx || bgm.isPlaying) return;
  bgm.isPlaying = true;
  bgm.currentStep = 0;
  bgm.nextNoteTime = audioCtx.currentTime + 0.1;
  bgm.schedulerId = setInterval(scheduleBGM, 25);
  scheduleBGM();
}

function stopBGM() {
  if (!audioCtx) return;
  bgm.isPlaying = false;
  if (bgm.schedulerId) {
    clearInterval(bgm.schedulerId);
    bgm.schedulerId = null;
  }
}

    if (comboTimer <= 0) {
      comboTimer = 0;
      comboCount = 0;
      comboEl.classList.remove('show');
    }
  }
}

/* =========================================================
   弹道（曳光弹）可视化
   ========================================================= */
const tracers = [];
const tracerCoreGeo = new THREE.CylinderGeometry(0.008, 0.008, 1, 4, 1, true);
const tracerGlowGeo = new THREE.CylinderGeometry(0.024, 0.024, 1, 6, 1, true);
const TRACER_LIFE = 0.12;

const _upAxis = new THREE.Vector3(0, 1, 0);

function spawnTracer(from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const dist = dir.length();
  if (dist < 0.05) return;
  dir.normalize();

  const mid = new THREE.Vector3().copy(from).addScaledVector(dir, dist / 2);
  const quat = new THREE.Quaternion().setFromUnitVectors(_upAxis, dir);

  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xfff8d0, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const core = new THREE.Mesh(tracerCoreGeo, coreMat);
  core.position.copy(mid);
  core.quaternion.copy(quat);
  core.scale.y = dist;
  scene.add(core);

  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffb84a, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const glow = new THREE.Mesh(tracerGlowGeo, glowMat);
  glow.position.copy(mid);
  glow.quaternion.copy(quat);
  glow.scale.y = dist;
  scene.add(glow);

  tracers.push({ core, glow, life: TRACER_LIFE, max: TRACER_LIFE });
}

function updateTracers(dt) {
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i];
    t.life -= dt;
    if (t.life <= 0) {
      scene.remove(t.core);
      t.core.material.dispose();
      scene.remove(t.glow);
      t.glow.material.dispose();
      tracers.splice(i, 1);
    } else {
      const k = t.life / t.max;
      t.core.material.opacity = k;
      t.glow.material.opacity = 0.55 * k;
      const s = 0.5 + 0.5 * k;
      t.core.scale.x = s;
      t.core.scale.z = s;
      t.glow.scale.x = s;
      t.glow.scale.z = s;
    }
  }
}

/* =========================================================
   粒子特效
   ========================================================= */
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.085, 6, 6);

function spawnBurst(pos, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, depthWrite: false });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.position.copy(pos);
    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.15, Math.random() - 0.5).normalize();
    const vel = dir.multiplyScalar(speed * (0.4 + Math.random() * 0.9));
    scene.add(mesh);
    particles.push({ mesh, vel, life: 0.55 + Math.random() * 0.3, max: 0.85 });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vel.y -= 16 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
    } else {
      p.mesh.material.opacity = Math.min(1, p.life / 0.4);
      p.mesh.scale.setScalar(0.4 + p.life);
    }
  }
}

const PART_HEAD = 'head';
const PART_BODY = 'body';
const PART_LEG  = 'leg';

const HEAD_MULT = 1.5;
const BODY_MULT = 1.0;
const LEG_MULT  = 0.6;

const ENEMY_MAX_HP = 100;
const ENEMY_RADIUS = 0.5;

const WEAVER_START_WAVE = 5;
const WEAVER_CHANCE = 0.15;

function spawnEnemy() {
  let x = 0, z = 0, ok = false;
  for (let t = 0; t < 40; t++) {
    const a = Math.random() * Math.PI * 2;
    const r = 24 + Math.random() * 16;
    x = Math.cos(a) * r;
    z = Math.sin(a) * r;
    if (Math.hypot(x - player.pos.x, z - player.pos.z) < 18) continue;
    let bad = false;
    for (const o of obstacles) {
      if (Math.abs(x - o.position.x) < o.userData.w / 2 + 1.2 &&
          Math.abs(z - o.position.z) < o.userData.d / 2 + 1.2) { bad = true; break; }
    }
    if (!bad) { ok = true; break; }
  }
  if (!ok) return;

  const isWeaver = wave >= WEAVER_START_WAVE && Math.random() < WEAVER_CHANCE;

  const mat = new THREE.MeshStandardMaterial({
    color: isWeaver ? 0xb44dff : 0xff3b5c,
    emissive: isWeaver ? 0x4a1066 : 0x661122,
    emissiveIntensity: 1,
    roughness: 0.45, metalness: 0.25
  });

  const root = new THREE.Group();
  root.position.set(x, 0, z);

  const head = new THREE.Mesh(HEAD_GEO, mat);
  head.position.y = 1.68;
  head.castShadow = true;

  const body = new THREE.Mesh(BODY_GEO, mat);
  body.position.y = 1.02;
  body.castShadow = true;

  const legL = new THREE.Mesh(LEG_GEO, mat);
  legL.position.set(-0.14, 0.32, 0);
  legL.castShadow = true;

  const legR = new THREE.Mesh(LEG_GEO, mat);
  legR.position.set(0.14, 0.32, 0);
  legR.castShadow = true;

  root.add(head, body, legL, legR);

  const baseSpeed = Math.min(6.0, 2.1 + wave * 0.28 + Math.random() * 0.5);
  const enemy = {
    root,
    mat,
    type: isWeaver ? 'weaver' : 'normal',
    parts: [head, body, legL, legR],
    hp: ENEMY_MAX_HP,
    maxHp: ENEMY_MAX_HP,
    speed: isWeaver ? baseSpeed * 1.15 : baseSpeed,
    damage: 7 + wave * 1.4,
    attackCd: 0.8,
    attackRange: 1.5,
    hitFlash: 0,
    phase: Math.random() * Math.PI * 2,
    baseEmissive: isWeaver ? 0x4a1066 : 0x661122,
    deathColor: isWeaver ? 0xb44dff : 0xff5577,
    weaveFreq: 2.0 + Math.random() * 0.9,
    weaveAmp: 3.6 + Math.random() * 1.0,
    avoidSign: 1,
    avoidTimer: 0,
    lastHitPart: PART_BODY,
  };

  if (isWeaver) {
    const spike = new THREE.Mesh(SPIKE_GEO, mat);
    spike.position.y = 2.04;
    spike.castShadow = true;
    root.add(spike);
    enemy.parts.push(spike);

    spike.userData.enemy = enemy;
    spike.userData.part = PART_HEAD;
    spike.userData.mult = HEAD_MULT;
  }

  head.userData.enemy = enemy;  head.userData.part = PART_HEAD;  head.userData.mult = HEAD_MULT;
  body.userData.enemy = enemy;  body.userData.part = PART_BODY;  body.userData.mult = BODY_MULT;
  legL.userData.enemy = enemy;  legL.userData.part = PART_LEG;   legL.userData.mult = LEG_MULT;
  legR.userData.enemy = enemy;  legR.userData.part = PART_LEG;   legR.userData.mult = LEG_MULT;

  scene.add(root);
  enemies.push(enemy);
}

function damageEnemy(enemy, dmg, point, color, part) {
  if (enemy.hp <= 0) return;
  enemy.hp -= dmg;
  enemy.hitFlash = 0.12;
  enemy.lastHitPart = part || PART_BODY;
  if (point) spawnBurst(point, color || 0xff88aa, 7, 5);
  sfxEnemyHit();

function killEnemy(enemy) {
  const i = enemies.indexOf(enemy);
  if (i < 0) return;
  enemies.splice(i, 1);
  scene.remove(enemy.root);

  const burstPos = enemy.root.position.clone();
  burstPos.y += 0.9;
  spawnBurst(burstPos, enemy.deathColor, 20, 8);

  enemy.mat.dispose();
  score += 100;

  const isHeadshot = enemy.lastHitPart === PART_HEAD;

  triggerCombo(isHeadshot);
  sfxCombo(comboCount);
}

/* =========================================================
   敌人寻路 / 避障
   ========================================================= */
const _nearbyCache = [];
function getNearbyObstacles(x, z, radius) {
  _nearbyCache.length = 0;
  for (const o of obstacles) {
    const obR = Math.hypot(o.userData.w / 2, o.userData.d / 2);
    const maxDist = obR + radius;
    const dx = x - o.position.x;
    const dz = z - o.position.z;
    if (dx * dx + dz * dz < maxDist * maxDist) _nearbyCache.push(o);
  }
  return _nearbyCache;
}

function pointBlocked(x, z, checkRadius, list) {
  for (let k = 0; k < list.length; k++) {
    const o = list[k];
    const hx = o.userData.w / 2 + checkRadius;
    const hz = o.userData.d / 2 + checkRadius;
    if (Math.abs(x - o.position.x) < hx && Math.abs(z - o.position.z) < hz) return true;
  }
  return false;
}

function getAvoidanceDir(px, pz, dirX, dirZ, radius, list, enemy) {
  if (list.length === 0) return { x: dirX, z: dirZ };

  const lookAhead = 2.4;
  const checkRadius = radius + 0.28;
  const steps = 4;

  function clearAlong(dx, dz) {
    for (let i = 1; i <= steps; i++) {
      const t = (i / steps) * lookAhead;
      if (pointBlocked(px + dx * t, pz + dz * t, checkRadius, list)) return false;
    }
    return true;
  }

  if (clearAlong(dirX, dirZ)) return { x: dirX, z: dirZ };

  const perpX = -dirZ;
  const perpZ = dirX;
  const preferred = enemy.avoidSign || 1;

  const angles = [0.45, 0.9, 1.35, Math.PI / 2];
  const signs = preferred > 0 ? [1, -1] : [-1, 1];

  for (const ang of angles) {
    for (const sgn of signs) {
      const cos = Math.cos(ang);
      const sin = Math.sin(ang) * sgn;
      const nx = dirX * cos + perpX * sin;
      const nz = dirZ * cos + perpZ * sin;
      if (clearAlong(nx, nz)) {
        enemy.avoidSign = sgn;
        enemy.avoidTimer = 0.6;
        return { x: nx, z: nz };
      }
    }
  }

  let bestO = null, bestD = Infinity;
  for (let k = 0; k < list.length; k++) {
    const o = list[k];
    const hx = o.userData.w / 2;
    const hz = o.userData.d / 2;
    const cx = Math.max(o.position.x - hx, Math.min(o.position.x + hx, px));
    const cz = Math.max(o.position.z - hz, Math.min(o.position.z + hz, pz));
    const d = Math.hypot(px - cx, pz - cz);
    if (d < bestD) { bestD = d; bestO = o; }
  }
  if (bestO) {
    let ex = px - bestO.position.x;
    let ez = pz - bestO.position.z;
    const el = Math.hypot(ex, ez) || 1;
    ex /= el; ez /= el;
    const tx = -ez * preferred;
    const tz = ex * preferred;
    let fx = ex * 0.6 + tx * 0.8;
    let fz = ez * 0.6 + tz * 0.8;
    const fl = Math.hypot(fx, fz) || 1;
    return { x: fx / fl, z: fz / fl };
  }

  return { x: dirX, z: dirZ };
}

function resolveEnemyCollision(pos, radius) {
  for (const o of obstacles) {
    const hx = o.userData.w / 2 + radius;
    const hz = o.userData.d / 2 + radius;
    const dx = pos.x - o.position.x;
    const dz = pos.z - o.position.z;
    if (Math.abs(dx) < hx && Math.abs(dz) < hz) {
      const px = hx - Math.abs(dx);
      const pz = hz - Math.abs(dz);
      if (px < pz) {
        pos.x = o.position.x + Math.sign(dx || 1) * hx;
      } else {
        pos.z = o.position.z + Math.sign(dz || 1) * hz;
      }
    }
  }
}

function updateEnemies(dt) {
  const pp = player.pos;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const p = e.root.position;

    const dx = pp.x - p.x;
    const dz = pp.z - p.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const nx = dx / dist, nz = dz / dist;

    e.root.rotation.y = Math.atan2(nx, nz);

    const nearby = getNearbyObstacles(p.x, p.z, 6.0);

    if (e.avoidTimer > 0) e.avoidTimer -= dt;

    if (dist > e.attackRange) {
      let desiredX = nx, desiredZ = nz;

      if (e.type === 'weaver') {
        const sway = Math.sin(time * e.weaveFreq + e.phase) * e.weaveAmp;
        const perpX = -nz, perpZ = nx;
        desiredX += perpX * sway * 0.15;
        desiredZ += perpZ * sway * 0.15;
        const dl = Math.hypot(desiredX, desiredZ);
        if (dl > 0.0001) { desiredX /= dl; desiredZ /= dl; }
      }

      const avoid = getAvoidanceDir(p.x, p.z, desiredX, desiredZ, ENEMY_RADIUS, nearby, e);

      const step = e.speed * dt;
      p.x += avoid.x * step;
      p.z += avoid.z * step;
    } else {
      e.attackCd -= dt;
      if (e.attackCd <= 0) {
        e.attackCd = 1.15;
        hurtPlayer(e.damage);
        e.root.scale.setScalar(1.12);
      }
    }

    for (let j = 0; j < enemies.length; j++) {
      if (j === i) continue;
      const o = enemies[j].root.position;
      const ddx = p.x - o.x, ddz = p.z - o.z;
      const d2 = ddx * ddx + ddz * ddz;
      if (d2 < 1.1 && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const push = (1.1 - d) * 0.5;
        p.x += (ddx / d) * push;
        p.z += (ddz / d) * push;
      }
    }

    resolveEnemyCollision(p, ENEMY_RADIUS);

    const rr = Math.hypot(p.x, p.z);
    if (rr > ARENA_RADIUS - 1) {
      p.x *= (ARENA_RADIUS - 1) / rr;
      p.z *= (ARENA_RADIUS - 1) / rr;
    }

    p.y = Math.sin(time * 3 + e.phase) * 0.06;

    if (e.hitFlash > 0) {
      e.hitFlash -= dt;
      e.mat.emissive.setHex(0xffffff);
      e.mat.emissiveIntensity = 2.6;
      e.root.scale.setScalar(1.08);
    } else {
      e.mat.emissive.setHex(e.baseEmissive);
      e.mat.emissiveIntensity = 1;
      e.root.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 12));
    }
  }
}

/* =========================================================

   ========================================================= */
function hurtPlayer(dmg) {
  if (state !== 'playing') return;
  player.hp -= dmg;
  damageAlpha = 0.62;
  sfxPlayerHurt();
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
}

function resetMobileFire() {
  mobileFiring = false;
  mobileFireCount = 0;
}

function resetJoystick() {
  mobileMoveX = 0;
  mobileMoveY = 0;
  if (joyTouchId !== null) joyTouchId = null;
  if (joystickKnob) joystickKnob.style.transform = 'translate(0px,0px)';
}

function gameOver() {
  state = 'dead';
  mouseDown = false;
  resetMobileFire();
  resetJoystick();
  resetCombo();
  stopBGM();
  if (!isMobile && document.pointerLockElement) document.exitPointerLock();
  hud.classList.remove('show');
  showOverlay('游戏结束', `你坚持到了第 ${wave} 波 · 最终得分 ${score}`, '重新开始', false);
}

let muzzleTimer = 0;

const _muzzleWorld = new THREE.Vector3();
const _fireQuat = new THREE.Quaternion();
const _fireEuler = new THREE.Euler(0, 0, 0, 'YXZ');

const PART_COLOR = {
  [PART_HEAD]: 0xffdd44,
  [PART_BODY]: 0xff6688,
  [PART_LEG]:  0x66aaff,
};

function fire() {
  if (state !== 'playing') return;

  const w = weapons[currentWeaponIndex];
  const d = w.def;

  if (w.reloading) return;
  if (time - lastShot < d.fireRate) return;
  if (w.ammo <= 0) {
    sfxEmpty();
    startReload();
    return;
  }

  const gap = time - lastShot;
  fireChain = gap < 0.28 ? Math.min(fireChain + 1, 30) : 0;

  /* 先确定子弹方向（使用开火前的瞄准状态，不含本发后坐力） */
  _fireEuler.set(player.pitch + viewRecoil, player.yaw, 0, 'YXZ');
  _fireQuat.setFromEuler(_fireEuler);

  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(_fireQuat);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(_fireQuat);
  const baseDir = new THREE.Vector3(0, 0, -1).applyQuaternion(_fireQuat);

  const originPos = new THREE.Vector3(
    player.pos.x,
    player.pos.y + player.height,
    player.pos.z
  );

  const spreadBase   = aiming ? d.adsSpreadBase   : d.hipSpreadBase;
  const spreadChain  = aiming ? d.adsSpreadPerChain : d.hipSpreadPerChain;
  const spreadMax    = aiming ? d.adsSpreadMax    : d.hipSpreadMax;

  if (spreadMax === 0) {
    recoilSpread = 0;
  } else {
    recoilSpread = Math.min(
      spreadMax,
      recoilSpread + spreadBase + fireChain * spreadChain
    );
  }

  const targets = [];
  for (const e of enemies) {
    for (const p of e.parts) targets.push(p);
  }
  for (const o of obstacles) targets.push(o);
  targets.push(ground);

  for (let pellet = 0; pellet < d.pellets; pellet++) {
    const dir = baseDir.clone();

    let ox = 0, oy = 0;

    if (d.pelletSpread > 0) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * d.pelletSpread;
      ox += Math.cos(ang) * r;
      oy += Math.sin(ang) * r;
    }

    if (recoilSpread > 0.0001) {
      ox += (Math.random() - 0.5) * 2 * recoilSpread;
      oy += (Math.random() - 0.5) * 2 * recoilSpread * 0.55;
    }

    if (ox !== 0 || oy !== 0) {
      dir.addScaledVector(right, ox).addScaledVector(up, oy).normalize();
    }

    raycaster.set(originPos, dir);

    const hits = raycaster.intersectObjects(targets, false);
    let hitPoint = null;

    if (hits.length > 0) {
      const hit = hits[0];
      hitPoint = hit.point;
      const enemy = hit.object.userData.enemy;

      if (enemy) {
        const part = hit.object.userData.part;
        const mult = hit.object.userData.mult || 1;
        damageEnemy(enemy, d.damage * mult, hit.point, PART_COLOR[part] || 0xff88aa, part);
      } else {
        spawnBurst(hit.point, 0x66ccff, d.pellets > 1 ? 3 : 6, 4.5);
      }
    }

    if (d.pellets === 1 || pellet < 3) {
      w.model.flash.getWorldPosition(_muzzleWorld);
      const tracerEnd = hitPoint
        ? hitPoint.clone()
        : originPos.clone().addScaledVector(dir, 180);
      spawnTracer(_muzzleWorld, tracerEnd);
    }
  }

  sfxShoot(d.id);

  const pitchKick = d.pitchKick + Math.min(fireChain, 25) * d.pitchKickPerChain;
  player.pitch += pitchKick;
  const lim = Math.PI / 2 - 0.08;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));

  viewRecoil += 0.005 * d.recoilVis;
  recoil = 1;
  muzzleTimer = 0.055;
  w.ammo--;
  lastShot = time;

  camera.rotation.set(player.pitch + viewRecoil, player.yaw, 0);
}

function startReload() {
  if (state !== 'playing') return;
  const w = weapons[currentWeaponIndex];
  if (w.reloading || w.ammo >= w.def.magSize) return;
  w.reloading = true;
  w.reloadTimer = w.def.reloadTime;
  sfxReload();
}

function toggleAim() {
  if (state !== 'playing') return;
  aiming = !aiming;
  if (aiming) {
    recoilSpread = 0;
    fireChain = 0;
    viewRecoil = 0;
  }
}

/* =========================================================
   武器切换
   ========================================================= */
const weaponNameEl = document.getElementById('weaponName');

function updateAmmoHUD() {
  const w = weapons[currentWeaponIndex];
  const d = w.def;
  weaponNameEl.textContent = d.name;
  if (w.reloading) {
    ammoVal.textContent = '换弹中…';
    ammoVal.style.color = '#ffb020';
  } else {
    ammoVal.textContent = `${w.ammo} / ${d.magSize}`;
    ammoVal.style.color = w.ammo <= Math.ceil(d.magSize * 0.2) ? '#ff5c7a' : '#7ef6ff';
  }
}

function switchWeapon(idx) {
  if (state !== 'playing') return;
  const total = weapons.length;
  idx = ((idx % total) + total) % total;
  if (idx === currentWeaponIndex) return;

  const prev = weapons[currentWeaponIndex];
  prev.reloading = false;
  prev.reloadTimer = 0;

  currentWeaponIndex = idx;

  weapons.forEach((w, i) => {
    if (w.model) w.model.group.visible = (i === idx);
  });

  recoilSpread = 0;
  fireChain = 0;
  viewRecoil = 0;
  recoil = 0;
  muzzleTimer = 0;
  lastShot = -10;

  sfxWeaponSwitch();
  updateAmmoHUD();
}

/* =========================================================
   波次系统
   ========================================================= */
let score = 0;
let wave = 0;
let toSpawn = 0;
let spawnTimer = 0;
let waveDelay = 0;
let waveDelayActive = false;

function startWave() {
  wave++;
  toSpawn = 3 + Math.floor(wave * 1.8);
  spawnTimer = 0.3;
  showBanner(`第 ${wave} 波`);
  sfxWaveStart();
}

function updateWaves(dt) {
  if (toSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      toSpawn--;
      spawnTimer = Math.max(0.22, 0.95 - wave * 0.07);
    }
  } else if (enemies.length === 0) {
    if (!waveDelayActive) {
      waveDelayActive = true;
      waveDelay = 3.2;
      showBanner('区域清空');
    } else {
      waveDelay -= dt;
      if (waveDelay <= 0) {
        waveDelayActive = false;
        startWave();
      }
    }
  }
}

/* =========================================================
   玩家更新（合并键盘与摇杆输入）
   ========================================================= */
const _fwd = new THREE.Vector3();
const _rgt = new THREE.Vector3();
const _wish = new THREE.Vector3();

function updatePlayer(dt) {
  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _rgt.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  /* 输入：摇杆 + 键盘 */
  let ix = mobileMoveX;
  let iz = mobileMoveY;

  if (keys['KeyW'] || keys['ArrowUp'])    iz += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iz -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;

  _wish.set(0, 0, 0).addScaledVector(_fwd, iz).addScaledVector(_rgt, ix);
  if (_wish.lengthSq() > 1e-6) _wish.normalize();

  const moveSpeed = player.speed * (1 - adsT * 0.3);

  const k = 1 - Math.exp(-(player.onGround ? 15 : 4.5) * dt);
  player.vel.x += (_wish.x * moveSpeed - player.vel.x) * k;
  player.vel.z += (_wish.z * moveSpeed - player.vel.z) * k;

  if (keys['Space'] && player.onGround) {
    player.vel.y = 7.4;
    player.onGround = false;
  }

  player.vel.y -= 25 * dt;
  player.pos.y += player.vel.y * dt;
  if (player.pos.y <= 0) {
    player.pos.y = 0;
    player.vel.y = 0;
    player.onGround = true;
  }

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  resolveCollisions(player.pos, player.radius);

  const rr = Math.hypot(player.pos.x, player.pos.z);
  if (rr > ARENA_RADIUS) {
    player.pos.x *= ARENA_RADIUS / rr;
    player.pos.z *= ARENA_RADIUS / rr;
  }

  if (time - lastShot > 0.10) {
    recoilSpread *= Math.exp(-9 * dt);
    if (recoilSpread < 0.00005) recoilSpread = 0;
  }
  if (time - lastShot > 0.35) fireChain = 0;

  const d = weapons[currentWeaponIndex].def;
  const targetFov = aiming ? BASE_FOV / d.adsZoom : BASE_FOV;
  if (Math.abs(camera.fov - targetFov) > 0.01) {
    camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-22 * dt));
    camera.updateProjectionMatrix();
  }

  const speedSq = player.vel.x * player.vel.x + player.vel.z * player.vel.z;
  const moving = player.onGround && speedSq > 2;
  player.bob += dt * (moving ? 12 : 2);
  const bobScale = 1 - adsT;
  const bobY = Math.sin(player.bob) * (moving ? 0.05 : 0.012) * bobScale;
  const bobX = Math.cos(player.bob * 0.5) * (moving ? 0.03 : 0.008) * bobScale;

  camera.position.set(
    player.pos.x + bobX,
    player.pos.y + player.height + bobY,
    player.pos.z
  );
  camera.rotation.set(player.pitch + viewRecoil, player.yaw, 0);

  viewRecoil *= Math.exp(-11 * dt);
}

function resolveCollisions(pos, radius) {
  for (const o of obstacles) {
    const hx = o.userData.w / 2 + radius;
    const hz = o.userData.d / 2 + radius;
    const dx = pos.x - o.position.x;
    const dz = pos.z - o.position.z;
    if (Math.abs(dx) < hx && Math.abs(dz) < hz) {
      const px = hx - Math.abs(dx);
      const pz = hz - Math.abs(dz);
      if (px < pz) {
        pos.x = o.position.x + Math.sign(dx || 1) * hx;
        player.vel.x = 0;
      } else {
        pos.z = o.position.z + Math.sign(dz || 1) * hz;
        player.vel.z = 0;
      }
    }
  }
}

/* =========================================================
   武器更新
   ========================================================= */
function updateWeapon(dt) {
  const w = weapons[currentWeaponIndex];
  const d = w.def;
  const model = w.model.group;

  recoil = Math.max(0, recoil - dt * 7.5);

  const adsTarget = aiming ? 1 : 0;
  adsT += (adsTarget - adsT) * (1 - Math.exp(-18 * dt));

  const bx = gunBaseHip.x + (gunBaseADS.x - gunBaseHip.x) * adsT;
  const by = gunBaseHip.y + (gunBaseADS.y - gunBaseHip.y) * adsT;
  const bz = gunBaseHip.z + (gunBaseADS.z - gunBaseHip.z) * adsT;

  model.position.set(
    bx,
    by + recoil * 0.045 * d.recoilVis,
    bz + recoil * 0.17 * d.recoilVis
  );
  model.rotation.x = recoil * 0.30 * d.recoilVis + recoilSpread * 1.1 * (1 - adsT * 0.6);
  model.rotation.z = recoil * 0.07;

  if (w.reloading) {
    const t = 1 - w.reloadTimer / d.reloadTime;
    model.rotation.x += Math.sin(t * Math.PI) * 0.85;
    model.position.y -= Math.sin(t * Math.PI) * 0.12;
  }

  if (muzzleTimer > 0) {
    muzzleTimer -= dt;
    const t = Math.max(0, muzzleTimer / 0.055);
    w.model.flash.material.opacity = t;
    w.model.flash.scale.setScalar(0.7 + t * 1.1);
    w.model.light.intensity = t * 9;
  } else {
    w.model.flash.material.opacity = 0;
    w.model.light.intensity = 0;
  }
}

const hud = document.getElementById('hud');
const hpFill = document.getElementById('hpFill');
const scoreVal = document.getElementById('scoreVal');
const waveVal = document.getElementById('waveVal');

function updateHUD(dt) {
  const pct = Math.max(0, player.hp) / player.maxHp * 100;
  hpFill.style.width = pct + '%';
  hpFill.style.background =
    pct > 60 ? 'linear-gradient(90deg,#12e0a0,#7ef6ff)' :
    pct > 30 ? 'linear-gradient(90deg,#ffb020,#ffe066)' :
               'linear-gradient(90deg,#ff2d55,#ff7a90)';

  scoreVal.textContent = score;
  waveVal.textContent = Math.max(1, wave);
  updateAmmoHUD();

  damageAlpha *= Math.exp(-4.5 * dt);
  damageEl.style.opacity = damageAlpha.toFixed(3);

  if (bannerTimer > 0) {
    bannerTimer -= dt;
    bannerEl.style.opacity = Math.max(0, Math.min(1, bannerTimer));
  } else {
    bannerEl.style.opacity = 0;
  }
}

function showBanner(text) {
  bannerEl.textContent = text;
  bannerTimer = 1.9;
}

function showOverlay(title, sub, btn, showSettings) {
  overlayTitle.textContent = title;
  overlaySub.textContent = sub;
  startBtn.textContent = btn;
  settingsPanel.classList.toggle('show', !!showSettings);
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
}

   设置项
   ========================================================= */
const sensRange = document.getElementById('sensRange');
const sensValue = document.getElementById('sensValue');
const musicRange = document.getElementById('musicRange');
const musicValue = document.getElementById('musicValue');
const sfxRange = document.getElementById('sfxRange');
const sfxValue = document.getElementById('sfxValue');

function applySensitivity(val) {
  sensitivityMul = Math.max(0.2, Math.min(3, val));
  sensValue.textContent = sensitivityMul.toFixed(2) + '×';
  sensRange.value = sensitivityMul;
}

function applyMusicVolume(val) {
  const v = Math.max(0, Math.min(1, val));
  musicValue.textContent = Math.round(v * 100) + '%';
  musicRange.value = v;
  if (musicGain) musicGain.gain.value = v;
}

function applySfxVolume(val) {
  const v = Math.max(0, Math.min(1, val));
  sfxValue.textContent = Math.round(v * 100) + '%';
  sfxRange.value = v;
  if (sfxGain) sfxGain.gain.value = v;
}

sensRange.addEventListener('input', () => applySensitivity(parseFloat(sensRange.value)));
musicRange.addEventListener('input', () => applyMusicVolume(parseFloat(musicRange.value)));
sfxRange.addEventListener('input', () => applySfxVolume(parseFloat(sfxRange.value)));

applySensitivity(parseFloat(sensRange.value));

/* =========================================================
   移动端触摸控制
   ========================================================= */
const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const fireAboveBtn = document.getElementById('fireAboveBtn');
const lookZone = document.getElementById('lookZone');
const jumpBtn = document.getElementById('jumpBtn');
const adsBtn = document.getElementById('adsBtn');
const reloadBtn = document.getElementById('reloadBtn');
const switchBtn = document.getElementById('switchBtn');
const pauseBtn = document.getElementById('pauseBtn');

let joyTouchId = null;
let joyCenter = { x: 0, y: 0 };
let joyRadius = 48;

let lookTouchId = null;
let lookLastX = 0;
let lookLastY = 0;

function updateJoyCenter() {
  const rect = joystickBase.getBoundingClientRect();
  joyCenter.x = rect.left + rect.width / 2;
  joyCenter.y = rect.top + rect.height / 2;
  joyRadius = rect.width * 0.36;
}

function handleJoyMove(cx, cy) {
  let dx = cx - joyCenter.x;
  let dy = cy - joyCenter.y;
  const len = Math.hypot(dx, dy);
  const max = joyRadius;
  if (len > max) {
    dx = (dx / len) * max;
    dy = (dy / len) * max;
  }
  joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;

  let nx = dx / max;
  let nz = -dy / max;

  if (Math.hypot(nx, nz) < 0.15) {
    nx = 0;
    nz = 0;
  }

  mobileMoveX = nx;
  mobileMoveY = nz;
}

function startMobileFire() {
  if (state !== 'playing') return;
  mobileFireCount++;
  mobileFiring = true;
  const w = weapons[currentWeaponIndex];
  if (!w.def.auto && mobileFireCount === 1) fire();
}

function stopMobileFire() {
  mobileFireCount = Math.max(0, mobileFireCount - 1);
  if (mobileFireCount === 0) mobileFiring = false;
}

function bindTapButton(el, onDown, onUp) {
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('active');
    if (onDown) onDown();
  }, { passive: false });

  const end = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('active');
    if (onUp) onUp();
  };
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
}

function initMobileControls() {
  if (!isMobile) return;

  /* ----- 左侧摇杆 ----- */
  joystickZone.addEventListener('touchstart', (e) => {
    if (state !== 'playing') return;
    for (const t of e.changedTouches) {
      if (joyTouchId === null) {
        joyTouchId = t.identifier;
        updateJoyCenter();
        handleJoyMove(t.clientX, t.clientY);
        e.preventDefault();
        return;
      }
    }
  }, { passive: false });

  joystickZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        handleJoyMove(t.clientX, t.clientY);
        e.preventDefault();
        break;
      }
    }
  }, { passive: false });

  const endJoy = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        joyTouchId = null;
        mobileMoveX = 0;
        mobileMoveY = 0;
        joystickKnob.style.transform = 'translate(0px,0px)';
        break;
      }
    }
  };
  joystickZone.addEventListener('touchend', endJoy);
  joystickZone.addEventListener('touchcancel', endJoy);

  /* ----- 摇杆上方开火键 ----- */
  bindTapButton(fireAboveBtn, startMobileFire, stopMobileFire);

  /* ----- 右侧视角 + 开火 ----- */
  lookZone.addEventListener('touchstart', (e) => {
    if (state !== 'playing') return;
    for (const t of e.changedTouches) {
      if (lookTouchId === null) {
        lookTouchId = t.identifier;
        lookLastX = t.clientX;
        lookLastY = t.clientY;
        startMobileFire();
        e.preventDefault();
        return;
      }
    }
  }, { passive: false });

  lookZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLastX;
        const dy = t.clientY - lookLastY;
        lookLastX = t.clientX;
        lookLastY = t.clientY;

        const d = weapons[currentWeaponIndex].def;
        const sens = BASE_SENS * sensitivityMul * (aiming ? d.adsSens : 1) * TOUCH_SENS_MUL;
        player.yaw -= dx * sens;
        player.pitch -= dy * sens;
        const lim = Math.PI / 2 - 0.06;
        player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
        e.preventDefault();
        break;
      }
    }
  }, { passive: false });

  const endLook = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        lookTouchId = null;
        stopMobileFire();
        break;
      }
    }
  };
  lookZone.addEventListener('touchend', endLook);
  lookZone.addEventListener('touchcancel', endLook);

  /* ----- 跳跃 ----- */
  bindTapButton(jumpBtn,
    () => { keys['Space'] = true; },
    () => { keys['Space'] = false; }
  );

  /* ----- 开镜 ----- */
  bindTapButton(adsBtn, () => { toggleAim(); }, null);

  /* ----- 换弹 ----- */
  bindTapButton(reloadBtn, () => { startReload(); }, null);

  /* ----- 切枪 ----- */
  bindTapButton(switchBtn, () => {
    switchWeapon(currentWeaponIndex + 1);
  }, null);

  /* ----- 暂停 ----- */
  pauseBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (state === 'playing') pauseGame();
  }, { passive: false });

  /* 横竖屏切换后重置摇杆中心 */
  window.addEventListener('orientationchange', () => {
    resetJoystick();
    lookTouchId = null;
    resetMobileFire();
  });
}

/* =========================================================
   暂停 / 恢复
   ========================================================= */
function pauseGame() {
  if (state !== 'playing') return;
  state = 'paused';
  mouseDown = false;
  resetMobileFire();
  resetJoystick();
  lookTouchId = null;
  hud.classList.remove('show');
  stopBGM();
  showOverlay('已暂停', '可在此调节灵敏度与音量，点击继续返回战场', '继续游戏', true);
}

function resumeGame() {
  state = 'playing';
  hideOverlay();
  hud.classList.add('show');
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startBGM();
}

/* =========================================================
   输入
   ========================================================= */
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();

  if (e.code === 'KeyR' && state === 'playing') startReload();

  if (state === 'playing') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') switchWeapon(0);
    else if (e.code === 'Digit2' || e.code === 'Numpad2') switchWeapon(1);
    else if (e.code === 'Digit3' || e.code === 'Numpad3') switchWeapon(2);
    else if (e.code === 'Digit4' || e.code === 'Numpad4') switchWeapon(3);
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouseDown = false;
});

window.addEventListener('wheel', (e) => {
  if (state !== 'playing' || isMobile) return;
  if (e.deltaY > 0) switchWeapon(currentWeaponIndex + 1);
  else if (e.deltaY < 0) switchWeapon(currentWeaponIndex - 1);
}, { passive: true });

document.addEventListener('mousedown', (e) => {
  if (isMobile) return;
  if (state !== 'playing' || document.pointerLockElement !== canvas) return;

  if (e.button === 0) {
    mouseDown = true;
    if (!weapons[currentWeaponIndex].def.auto) fire();
  }
  if (e.button === 2) {
    toggleAim();
  }
});

document.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouseDown = false;
});

document.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('mousemove', (e) => {
  if (isMobile) return;
  if (document.pointerLockElement !== canvas) return;
  const d = weapons[currentWeaponIndex].def;
  const sens = BASE_SENS * sensitivityMul * (aiming ? d.adsSens : 1);
  player.yaw -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  const lim = Math.PI / 2 - 0.06;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});

/* ---------- 指针锁定（仅桌面端） ---------- */
startBtn.addEventListener('click', () => {
  initAudio();
  applyMusicVolume(parseFloat(musicRange.value));
  applySfxVolume(parseFloat(sfxRange.value));

  if (isMobile) {
    if (state === 'menu' || state === 'dead') {
      startGame();
    } else if (state === 'paused') {
      resumeGame();
    }
  } else {
    canvas.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  if (isMobile) return;

  if (document.pointerLockElement === canvas) {
    if (state === 'menu' || state === 'dead') {
      startGame();
    } else if (state === 'paused') {
      resumeGame();
    }
  } else {
    if (state === 'playing') {
      pauseGame();
    }
  }
});

/* =========================================================
   开始 / 重置
   ========================================================= */
function startGame() {
  for (const e of enemies) {
    scene.remove(e.root);
    e.mat.dispose();
  }
  enemies.length = 0;

  for (const p of particles) {
    scene.remove(p.mesh);
    p.mesh.material.dispose();
  }
  particles.length = 0;

  for (const t of tracers) {
    scene.remove(t.core);
    t.core.material.dispose();
    scene.remove(t.glow);
    t.glow.material.dispose();
  }
  tracers.length = 0;

  score = 0;
  wave = 0;
  toSpawn = 0;
  spawnTimer = 0;
  waveDelay = 0;
  waveDelayActive = false;
  lastShot = -10;
  recoil = 0;
  muzzleTimer = 0;
  viewRecoil = 0;
  damageAlpha = 0;
  bannerTimer = 0;
  mouseDown = false;

  resetMobileFire();
  resetJoystick();
  lookTouchId = null;

  resetCombo();

  aiming = false;
  adsT = 0;
  recoilSpread = 0;
  fireChain = 0;
  camera.fov = BASE_FOV;
  camera.updateProjectionMatrix();

  player.hp = player.maxHp;
  player.pos.set(0, 0, 8);
  player.vel.set(0, 0, 0);
  player.yaw = 0;
  player.pitch = 0;
  player.onGround = true;
  player.bob = 0;

  camera.position.set(0, player.height, 8);
  camera.rotation.set(0, 0, 0);

  currentWeaponIndex = 0;
  weapons.forEach((w, i) => {
    w.ammo = w.def.magSize;
    w.reloading = false;
    w.reloadTimer = 0;
    w.model.group.position.copy(gunBaseHip);
    w.model.group.rotation.set(0, 0, 0);
    w.model.flash.material.opacity = 0;
    w.model.light.intensity = 0;
    w.model.group.visible = (i === currentWeaponIndex);
  });

  updateAmmoHUD();

  state = 'playing';
  hideOverlay();
  hud.classList.add('show');

  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startBGM();

  startWave();
  updateHUD(0);
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  time += dt;

  if (state === 'playing') {
    updatePlayer(dt);
    updateEnemies(dt);
    updateWaves(dt);
    updateWeapon(dt);
    updateCombo(dt);

    const w = weapons[currentWeaponIndex];
    if (w.reloading) {
      w.reloadTimer -= dt;
      if (w.reloadTimer <= 0) {
        w.reloading = false;
        w.ammo = w.def.magSize;
      }
    }

    if ((mouseDown || mobileFiring) && w.def.auto) fire();
  } else {
    const w = weapons[currentWeaponIndex];
    w.model.group.position.copy(gunBaseHip);
    w.model.group.rotation.set(0, 0, 0);
    if (Math.abs(camera.fov - BASE_FOV) > 0.01) {
      camera.fov += (BASE_FOV - camera.fov) * (1 - Math.exp(-12 * dt));
      camera.updateProjectionMatrix();
    }
  }

  updateParticles(dt);
  updateTracers(dt);
  updateHUD(dt);

  renderer.render(scene, camera);
}

/* =========================================================
   自适应
   ========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   启动
   ========================================================= */
initMobileControls();

if (isMobile) {
  overlaySub.innerHTML = '在霓虹竞技场中生存下去，击退一波又一波的敌人。<br>使用左侧摇杆移动，右侧滑动瞄准并开火。';
}

requestAnimationFrame(loop);
</script>
